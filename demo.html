<style>
/* Layout: ivory-and-ink ledger with one gold accent. A full-screen photo gate opens the app, a slim sticky bar carries one labelled MENU button, an off-canvas drawer holds the pages, and type and targets run large for readers in their 40s and 50s. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#141414; --muted:#5A5852; --line:#E7E3DA; --line-strong:#BDB7A8;
  --gold:#B8934A; --gold-text:#6F5418; --accent:#B8934A; --accent-ink:#17120A; --accent-soft:#F3EBD8; --focus:#6F5418;
  --logo-bg:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#DDF1E5; --warn:#9A5200; --warn-soft:#FBE9CC; --bad:#B3321F; --bad-soft:#FADDD7;
  --gate-bg:#0B0B0C; --gate-ink:#F3EEE3; --gate-gold:#D4B574;
  --dr-bg:#101011; --dr-ink:#F3EEE3; --dr-line:#2C2A26; --dr-gold:#D4B574;
  --font-display:'Cormorant Garamond','Noto Serif Thai',Georgia,serif;
  --font-body:'Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E0F; --surface:#171718; --ink:#F1ECE2; --muted:#ABA698; --line:#2B2A27; --line-strong:#4B4943;
    --gold:#D4B574; --gold-text:#D9BC7E; --accent:#D4B574; --accent-ink:#17120A; --accent-soft:#2E2819; --focus:#E7CD96;
    --ok:#5CC28A; --ok-soft:#17332A; --warn:#E8A24A; --warn-soft:#3A2B12; --bad:#F0877A; --bad-soft:#3D1E1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E0F; --surface:#171718; --ink:#F1ECE2; --muted:#ABA698; --line:#2B2A27; --line-strong:#4B4943;
  --gold:#D4B574; --gold-text:#D9BC7E; --accent:#D4B574; --accent-ink:#17120A; --accent-soft:#2E2819; --focus:#E7CD96;
  --ok:#5CC28A; --ok-soft:#17332A; --warn:#E8A24A; --warn-soft:#3A2B12; --bad:#F0877A; --bad-soft:#3D1E1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
body.gated{overflow:hidden}
body.gated #shell,body.gated #drawer{display:none}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:23px} h3{font-size:20px}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:24px;height:24px;flex:none}
.inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:24px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* gate */
#gate{display:none;position:fixed;inset:0;z-index:100;background:var(--gate-bg);color:var(--gate-ink);overflow:hidden}
body.gated #gate{display:block}
.slides,.gate-bare{position:absolute;inset:0}

.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease}
.slide.on{opacity:1}
.gate-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,9,.62) 0%,rgba(8,8,9,.42) 45%,rgba(8,8,9,.86) 100%)}
.gate-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));overflow-y:auto}
.gate-logo{width:120px;height:120px;border-radius:50%;background:var(--logo-bg);display:block;box-shadow:0 0 0 1px var(--gate-gold),0 0 0 7px rgba(212,181,116,.18)}

.gate-title .g2{font-size:.6em;letter-spacing:.06em;color:var(--gate-gold)}
.gate-rule{width:72px;height:1px;background:var(--gate-gold)}
.gate-btn{display:inline-flex;align-items:center;gap:12px;min-height:60px;padding:0 34px;background:transparent;color:var(--gate-ink);border:1px solid var(--gate-gold);cursor:pointer;font-size:19px;letter-spacing:.04em}
.gate-btn:hover{background:var(--gate-gold);color:#17120A}
.gate-btn:focus-visible,.gate-ghost:focus-visible,.gdot:focus-visible{outline-color:var(--gate-gold)}
.gate-ghost{min-height:48px;padding:0 18px;background:transparent;border:0;color:var(--gate-ink);text-decoration:underline;text-underline-offset:5px;cursor:pointer;font-size:16px;opacity:.9}
.gate-dots{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px}

.gdot::after{content:"";position:absolute;left:8px;right:8px;top:16px;height:2px;background:rgba(243,238,227,.45)}

@media (prefers-reduced-motion:no-preference){.slide.on{animation:drift 12s ease-out forwards}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.06)}}}

/* top bar */
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}

}

/* drawer */
#drawer{position:fixed;inset:0;z-index:70;pointer-events:none;visibility:hidden;transition:visibility 0s linear .28s}
body.menu-open #drawer{pointer-events:auto;visibility:visible;transition-delay:0s}
.dr-bk{position:absolute;inset:0;background:rgba(6,6,7,.62);opacity:0;transition:opacity .28s}
body.menu-open .dr-bk{opacity:1}
.dr{position:absolute;top:0;bottom:0;left:0;width:min(88vw,380px);background:var(--dr-bg);color:var(--dr-ink);transform:translateX(-100%);transition:transform .28s ease;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) 0 max(20px,env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px);display:flex;flex-direction:column;gap:14px}
body.menu-open .dr{transform:none}
@media (prefers-reduced-motion:reduce){#drawer,.dr-bk,.dr{transition:none}}
.dr-head{display:flex;align-items:center;gap:14px;padding:0 12px 0 20px}
.dr-head .logo{width:64px;height:64px}
.dr-head>div:nth-child(2){flex:1;min-width:0}
.dr-eyebrow{font-size:12.5px;letter-spacing:.3em;color:var(--dr-gold)}

.dr-item:hover{background:rgba(212,181,116,.1)}

.dr-rule{height:1px;background:var(--dr-line);margin:2px 20px}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 20px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:50px;height:50px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon:hover{background:var(--accent-soft)}
.in{width:100%;min-height:50px;padding:6px 12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:17px}
.in:focus{outline:3px solid var(--focus);outline-offset:0}

.f{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted);min-width:0}
.datebtn{min-height:50px;padding:6px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font-size:17px;width:100%}
.datebtn:hover{border-color:var(--gold)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.frm .full{grid-column:1 / -1}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 16px;border:1px solid var(--line-strong);cursor:pointer;color:var(--ink);font-size:17px}
.radios input,.chk input{width:22px;height:22px;accent-color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:15px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .grow{flex:1 1 200px;min-width:0}

/* panels and lists */
.panel{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.hello{display:flex;flex-direction:column;gap:2px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:20px;min-height:130px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer}
.tile:hover{border-color:var(--gold)}
.tile .ic{width:32px;height:32px;color:var(--gold-text);margin-bottom:6px}
.tile b{font-family:var(--font-display);font-size:23px;font-weight:600;line-height:1.3}
.tile span{color:var(--muted);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:15px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:36px;font-weight:600;line-height:1.2;font-variant-numeric:lining-nums tabular-nums}
.stat .s{font-size:14.5px;color:var(--muted)}
.v.neg{color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .sub{font-size:15px;color:var(--muted);grid-column:1}
.item .side{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(150px,1fr) auto auto;gap:10px 16px;align-items:center;padding:16px 0;border-top:1px solid var(--line);cursor:pointer}
.srow:first-child{border-top:0}

.bar{height:8px;background:var(--line);overflow:hidden}

@media (max-width:620px){.srow{grid-template-columns:minmax(0,1fr) auto}.srow .hrs{grid-column:1 / -1;order:3}.srow>.btn{grid-column:1 / -1;order:4}}
.chip{display:inline-flex;align-items:center;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:500;background:var(--line);color:var(--muted);white-space:nowrap}

.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* schedule */
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}

.cls:hover{border-color:var(--gold)}
.cls .tm{font-variant-numeric:tabular-nums;font-size:15px;color:var(--gold-text);font-weight:600}

/* teacher timetable */
.tsel{display:flex;flex-wrap:wrap;gap:8px}

.tchip:hover{border-color:var(--gold)}
.tchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tgroup{display:flex;flex-direction:column;gap:12px;min-width:0}
.tgroup-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.tgroup-h h3{font-size:24px}
.tt-wrap{overflow-x:auto;border:1px solid var(--line-strong);background:var(--surface);max-width:100%}
.tt{border-collapse:separate;border-spacing:0;width:100%;min-width:1010px;table-layout:fixed}
.tt th,.tt td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.tt tr>*:last-child{border-right:0}

.tt thead th{background:var(--accent-soft);font-family:var(--font-display);font-size:19px;font-weight:600;text-align:center;padding:12px 6px}
.tt thead th.today{box-shadow:inset 0 -3px 0 var(--gold)}
.tt td.today{background:var(--accent-soft)}
.tt .tm-h{width:92px;position:sticky;left:0;z-index:1;background:var(--surface);text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold-text);font-size:17px}
.tt thead th.tm-h{background:var(--accent-soft);color:var(--ink);font-size:15px}
.tt td{height:1px}
.tt td:empty::after{content:"";display:block;min-height:56px}
.tt-c{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:10px 10px;background:var(--bg);border:1px solid var(--line-strong);color:var(--ink);cursor:pointer;margin-bottom:8px}
.tt-c:last-child{margin-bottom:0}

/* calendar */
.attgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
@media (min-width:900px){.attgrid{grid-template-columns:minmax(320px,430px) minmax(0,1fr)}.calpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}}
.dayside{display:flex;flex-direction:column;gap:16px;min-width:0}

.cal-dow{text-align:center;font-size:15px;color:var(--muted);padding:4px 0}
.cal-day{position:relative;min-height:52px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px;font-variant-numeric:lining-nums tabular-nums;padding:0}
.cal-day:hover{border-color:var(--gold)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--gold-text)}
.cal-day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-day.has::after{content:"";position:absolute;left:50%;bottom:6px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold-text)}
.cal-day.sel.has::after{background:var(--accent-ink)}
.cal-day.done::before{content:"✓";position:absolute;top:2px;right:5px;font-size:13px;color:var(--ok);font-weight:700}
.cal-day.sel.done::before{color:var(--accent-ink)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:8px}
.lg{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold-text)}
.lg.done{border-radius:0;width:auto;height:auto;background:none;color:var(--ok);font-weight:700;font-style:normal}
.lg.done::before{content:"✓"}
.cal-foot{display:flex;justify-content:flex-start}
.mp-year{display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-size:24px}
.mp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mp{min-height:60px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:18px}
.mp:hover{border-color:var(--gold)}
.mp.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* attendance: p=มา a=ขาด l=ลา (ไม่นับชั่วโมง, จำกัด LEAVE_LIMIT ครั้ง/เดือน) m=ชดเชย */
.att-card{background:var(--surface);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.att-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.att-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.att-row .nm{min-width:0;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line-strong);overflow:hidden}
.seg button{min-height:54px;min-width:70px;padding:0 12px;border:0;border-left:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:17px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].p{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].a{background:var(--bad-soft);color:var(--bad)}
.seg button[aria-pressed="true"].m{background:var(--accent-soft);color:var(--gold-text)}
.seg button[aria-pressed="true"].l{background:var(--warn-soft);color:var(--warn)}
.att-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.att-foot select{flex:1 1 180px;min-width:0}
.hin{width:84px;min-height:46px;text-align:center}
@media (max-width:560px){
  .att-row{grid-template-columns:minmax(0,1fr)}
  .seg{display:flex;width:100%}
  .seg button{flex:1;min-width:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tile{padding:16px;min-height:120px}
  .tile b{font-size:20px}
}

/* dialogs */
.ov{position:fixed;inset:0;background:rgba(10,10,11,.58);display:flex;align-items:flex-start;justify-content:center;z-index:120;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#layer2 .ov{z-index:130}
.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);width:100%;max-width:620px;margin:auto;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 10px 10px 20px;border-bottom:1px solid var(--line)}
.db{padding:20px;display:flex;flex-direction:column;gap:16px}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.df .sp{margin-right:auto}
.chk-list{max-height:260px;overflow-y:auto;border:1px solid var(--line);padding:4px 12px}
.chk{display:flex;align-items:center;gap:12px;min-height:50px;cursor:pointer}
.tscroll{overflow-x:auto;border:1px solid var(--line)}
.ledger{border-collapse:collapse;min-width:100%;font-variant-numeric:tabular-nums;text-align:center;background:var(--surface)}
.ledger th,.ledger td{border:1px solid var(--line);padding:8px 6px;min-width:42px;font-size:16px;font-weight:500}
.ledger thead th{background:var(--accent-soft);color:var(--gold-text);font-weight:600}
.ledger .no{min-width:44px;color:var(--muted)}
.ledger .nm{position:sticky;left:0;background:var(--surface);text-align:left;min-width:140px;font-weight:600;z-index:1;box-shadow:1px 0 0 var(--line-strong)}
.ledger thead .nm{background:var(--accent-soft);z-index:2}
.ledger .over{background:var(--warn-soft);color:var(--warn)}
.ledger .gap{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.ledger .mk{color:var(--gold-text);text-decoration:underline;text-underline-offset:3px}
.ledger .ab{color:var(--bad);text-align:left;min-width:90px;font-weight:500}
.ledger .left{font-weight:600}
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;font-variant-numeric:tabular-nums}
.sum .r{text-align:right}
.sum .tot{font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{display:flex;flex-direction:column;gap:8px}
.ph-img{aspect-ratio:4/3;background-size:cover;background-position:center;background-color:var(--line);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:14px 22px;font-size:17px;z-index:140;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}

.demo-banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--gold-text);padding:8px 16px;font-size:15px;text-align:center}
/* login form on the gate */
.gate-form{display:flex;flex-direction:column;gap:8px;width:min(340px,86vw);text-align:left}
.gate-lab{font-size:15px;color:var(--gate-gold)}
.gate-field{width:100%;min-height:56px;padding:6px 14px;font-size:18px;background:rgba(243,238,227,.1);border:1px solid var(--gate-gold);color:var(--gate-ink)}
.gate-field:focus{outline:3px solid var(--gate-gold);outline-offset:2px}
.gate-msg{min-height:22px;font-size:15.5px;color:#F0877A;text-align:center;max-width:min(340px,86vw)}
.gate-msg.ok{color:var(--gate-gold)}
.gate-form .gate-btn{justify-content:center;margin-top:6px}
.gate-btn:disabled{opacity:.55;cursor:default}

/* footer */
.foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:20px;margin-top:8px}
.foot-n{font-family:var(--font-display);font-size:20px;font-weight:600}
.foot-a{font-size:13px;letter-spacing:.14em;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.ov{animation:fade .14s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}
</style>

function cname(c){return 'คอร์ส '+(Math.round((+c.hours||0)*100)/100)+' ชม. '+(Math.round(+c.price||0)).toLocaleString('en-US');}

function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return String(n).padStart(2,'0');}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addMonths(m,n){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function monthLabel(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});}
function monthShort(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('th-TH',{month:'short',year:'2-digit'});}
function dateLabel(iso){return new Date(iso+'T00:00:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function shortDate(iso){return new Date(iso+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});}
function num(n){return (Math.round((+n||0)*100)/100).toString();}
function baht(n){return '฿'+(Math.round((+n||0)*100)/100).toLocaleString('th-TH');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function genId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function $(s,r){return (r||document).querySelector(s);}

function mergeSettings(d){
  var s=clone(DEFAULTS);
  if(d.teachers&&d.teachers.length)s.teachers=d.teachers;
  if(d.courses){CKEYS.forEach(function(k){if(d.courses[k])s.courses[k]=Object.assign({},s.courses[k],d.courses[k]);});}
  if(typeof d.makeupLimit==='number'){CKEYS.forEach(function(k){if(!(d.courses&&d.courses[k]&&typeof d.courses[k].makeupDays==='number'))s.courses[k].makeupDays=d.makeupLimit;});}
  if(typeof d.sessionHours==='number')s.sessionHours=d.sessionHours;
  return nameCourses(s);
}

/* ---------- derived data ---------- */
function byName(a,b){return a.name.localeCompare(b.name,'th');}
function curMonth(){return todayISO().slice(0,7);}
/* พักการเรียน: paused===true ตั้งแต่เดือน pausedFrom เป็นต้นไป ข้อมูลยังอยู่ แต่ไม่เรียกเก็บเงินและไม่แสดงในตาราง */
function pausedIn(s,m){return !!s&&s.paused===true&&(!s.pausedFrom||(m||st.month)>=s.pausedFrom);}
function activeStudents(m){m=m||st.month;return Array.from(st.students.values()).filter(function(s){return s.active!==false&&!pausedIn(s,m);}).sort(byName);}
function rosterOf(c,m){m=m||curMonth();return (c.studentIds||[]).map(function(id){return st.students.get(id);}).filter(function(s){return s&&s.active!==false&&!pausedIn(s,m);});}
function pauseMonthOptions(sel){
  var cur=curMonth(),list=[],i;
  for(i=-2;i<=3;i++)list.push(addMonths(cur,i));
  if(sel&&list.indexOf(sel)<0){list.push(sel);list.sort();}
  var pick=sel||cur;
  return list.map(function(m){return '<option value="'+m+'"'+(m===pick?' selected':'')+'>'+esc(monthLabel(m))+'</option>';}).join('');
}
function course(s){return st.settings.courses[s.course]||st.settings.courses.std;}
var LEAVE_LIMIT=2;
function makeupDays(s){var v=+course(s).makeupDays;return v>=0?v:0;}
function teacherName(id){var t=st.settings.teachers.find(function(x){return x.id===id;});return t?t.name:'ยังไม่ระบุครู';}
function studentClasses(sid){return Array.from(st.classes.values()).filter(function(c){return (c.studentIds||[]).indexOf(sid)>=0;});}
function monthStats(m){
  var map=new Map();
  st.sessions.forEach(function(s){
    if(!s.date||s.date.slice(0,7)!==m)return;
    var att=s.att||{},h=+s.hours||0;
    Object.keys(att).forEach(function(sid){
      var a=att[sid],r=map.get(sid);
      if(!r){r={used:0,mk:0,ab:0,lv:0};map.set(sid,r);}
      if(a==='p'||a==='m'){r.used+=h;if(a==='m')r.mk++;}else if(a==='a')r.ab++;else if(a==='l')r.lv++;
    });
  });
  return map;
}
function payMap(m){
  var map=new Map();
  st.payments.forEach(function(p){if(p.month!==m)return;map.set(p.studentId,(map.get(p.studentId)||0)+(+p.amount||0));});
  return map;
}
function payStatus(s,paid){var price=+course(s).price||0;return paid>=price?'paid':(paid>0?'partial':'unpaid');}
function statusChip(k){
  return k==='paid'?'<span class="chip ok">ชำระแล้ว</span>':k==='partial'?'<span class="chip warn">จ่ายบางส่วน</span>':'<span class="chip bad">ค้างชำระ</span>';
}
function sumBy(arr,f){return arr.reduce(function(t,x){return t+(+f(x)||0);},0);}
function hasExamples(){
  return COLLS.some(function(c){return Array.from(st[c].values()).some(function(x){return x.example;});});
}
function strip(o){var r={};Object.keys(o).forEach(function(k){if(k!=='id'&&o[k]!==undefined)r[k]=o[k];});return r;}

/* ---------- toast / dialog ---------- */
var toastTimer=null;
function toast(msg,err){
  var host=$('#toast-host');
  host.innerHTML='<div class="toast'+(err?' err':'')+'" role="status">'+esc(msg)+'</div>';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){host.innerHTML='';},err?5000:2200);
}
function errText(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'พื้นที่เก็บข้อมูลเต็ม ลบข้อมูลเก่าก่อนบันทึกใหม่';
  if(c==='resource_exhausted')return 'บันทึกถี่เกินไป รอสักครู่แล้วลองอีกครั้ง';
  if(c==='unavailable')return 'เชื่อมต่อไม่ได้ ลองอีกครั้ง';
  if(c==='permission-denied')return 'บัญชีนี้ไม่มีสิทธิ์บันทึกข้อมูล ตรวจ Rules ใน Firebase';
  if(c==='resource-exhausted')return 'บันทึกถี่เกินไป หรือใช้โควตาครบ รอสักครู่แล้วลองอีกครั้ง';
  return 'บันทึกไม่สำเร็จ'+(e&&e.message?' ('+e.message+')':'');
}
async function run(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true;}
  catch(e){toast(errText(e),true);return false;}
}

  else h+='<div class="list">'+today.map(function(c){

function studentRows(){
  var m=st.month,ms=monthStats(m),pm=payMap(m),q=st.q.trim().toLowerCase();
  var all=Array.from(st.students.values()).filter(function(s){return s.active!==false;}).sort(function(a,b){return (pausedIn(a,m)?1:0)-(pausedIn(b,m)?1:0)||byName(a,b);});
  return all.filter(function(s){
    if(q&&(s.name+' '+(s.fullName||'')).toLowerCase().indexOf(q)<0)return false;
    var ps=pausedIn(s,m);
    if(st.filter==='paused')return ps;
    if(ps)return st.filter==='all';
    var k=payStatus(s,pm.get(s.id)||0);
    if(st.filter==='unpaid'&&k==='paid')return false;
    if(st.filter==='paid'&&k!=='paid')return false;
    return true;
  }).map(function(s){
    if(pausedIn(s,m))return pausedRow(s);
    var mst=ms.get(s.id)||{used:0,mk:0},u=mst.used,tot=+course(s).hours||0,pct=tot?Math.min(100,u/tot*100):0,lim=makeupDays(s),slots='';
    for(var i=0;i<Math.max(lim,mst.mk);i++)slots+='<i class="slot'+(i<mst.mk?(i>=lim?' over':' on'):'')+'"></i>';
    var cl=studentClasses(s.id).map(function(c){return c.name;}).join(', ');
    return '<div class="srow" data-act="stu" data-id="'+s.id+'"><div class="nm"><b>'+esc(s.name)+'</b>'+(s.example?' <span class="chip">ตัวอย่าง</span>':'')
      +'<div class="muted small">'+esc([s.fullName,s.age?'อายุ '+s.age+' ปี':'',s.school].filter(Boolean).join(' · '))+'</div>'+'<div class="muted small">'+esc(course(s).name)+((s.instruments&&s.instruments.length)?' · '+esc(s.instruments.join(', ')):'')+((s.schedule||s.studyStart)?' · '+esc((s.schedule||'')+(s.studyStart?' '+s.studyStart+'-'+s.studyEnd:'')):'')+(cl?' · '+esc(cl):'')+'</div></div>'
      +'<div class="hrs"><div class="bar"><i class="'+(u>tot?'over':'')+'" style="width:'+pct+'%"></i></div><span>เรียนแล้ว '+num(u)+' / '+num(tot)+' ชม.</span><span class="mk">ชดเชย <span class="slots" role="img" aria-label="ชดเชยแล้ว '+mst.mk+' จาก '+lim+' วัน">'+slots+'</span> '+mst.mk+'/'+lim+' วัน</span></div>'
      +statusChip(payStatus(s,pm.get(s.id)||0))
      +'<button class="btn sm" data-act="pay" data-id="'+s.id+'">รับเงิน</button></div>';
  }).join('');
}

function addMinutes(t,mins){
  if(!t||!/^\d{1,2}:\d{2}$/.test(t))return '';
  var p=t.split(':').map(Number),tot=p[0]*60+p[1]+Math.round(mins);
  tot=((tot%1440)+1440)%1440;
  return pad(Math.floor(tot/60))+':'+pad(tot%60);
}

function buildCards(date){
  var wd=new Date(date+'T00:00:00').getDay(),cards=[],seen={};
  Array.from(st.classes.values()).filter(function(c){return +c.weekday===wd;}).forEach(function(c){
    var key=c.id+'_'+date,sess=st.sessions.get(key)||null;
    cards.push({key:key,classId:c.id,name:c.name,teacherId:c.teacherId,start:c.start||'',hours:sess?(+sess.hours||0):(+c.hours||st.settings.sessionHours),roster:(c.studentIds||[]).filter(function(id){var st0=st.students.get(id);return !(st0&&pausedIn(st0,date.slice(0,7)));}),saved:sess});
    seen[key]=1;
  });
  st.sessions.forEach(function(s){
    if(s.date===date&&!seen[s.id])cards.push({key:s.id,classId:s.classId||null,name:s.name||'คลาสพิเศษ',teacherId:s.teacherId,start:s.start||'',hours:+s.hours||0,roster:[],saved:s});
  });
  return cards.sort(function(a,b){return (a.start||'').localeCompare(b.start||'');});
}

/* ---------- school photos ---------- */
function shrinkImage(file,max){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error('แปลงรูปไม่สำเร็จ'));},'image/jpeg',0.7);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('เปิดรูปไม่ได้ ใช้รูปชนิด JPG หรือ PNG'));};
    img.src=url;
  });
}
function photoErr(e){
  var c=e&&e.code;
  if(c==='too_large')return 'รูปใหญ่เกินไป';
  if(c==='quota_or_state')return 'พื้นที่เก็บรูปเต็ม ลบรูปเก่าก่อน';
  if(c==='unsupported_type')return 'ไฟล์ชนิดนี้ใช้ไม่ได้ ใช้รูป JPG หรือ PNG';
  if(c==='rate_limited')return 'อัปโหลดถี่เกินไป รอสักครู่แล้วลองอีกครั้ง';
  return (e&&e.message)?e.message:'อัปโหลดไม่สำเร็จ';
}
function openPhotos(){
  var can=!!st.assets,list=st.photos;
  dlg('รูปโรงเรียน',
    '<div class="muted">รูปเหล่านี้จะเลื่อนเป็นภาพพื้นหลังที่หน้าแรกก่อนเข้าสมุด (ได้สูงสุด '+MAXPH+' รูป)</div>'
    +(list.length?'<div class="ph-grid">'+list.map(function(p){return '<div class="ph"><div class="ph-img" style="background-image:url(\''+photoSrc(p)+'\')"></div>'+(can?'<button class="btn sm danger" data-act="photodel" data-id="'+p.id+'">ลบรูป</button>':'')+'</div>';}).join('')+'</div>':'<div class="empty"><span>ยังไม่มีรูปโรงเรียน กด “เพิ่มรูป” แล้วเลือกรูปจากเครื่อง เลือกได้หลายรูปพร้อมกัน</span></div>')
    +(can?'<input type="file" id="ph_file" accept="image/*" multiple hidden><button class="btn primary" data-act="photoadd" id="ph_add"'+(list.length>=MAXPH?' disabled':'')+'>'+icon('plus')+'เพิ่มรูป</button><div class="muted small" id="ph_msg" role="status"></div>':'<div class="muted small">มุมมองนี้เพิ่มรูปไม่ได้ เปิดสมุดจากบัญชีเจ้าของเพื่อเพิ่มรูป</div>'),
    '<button class="btn" data-act="close">ปิด</button>');
}
async function uploadPhotos(files){
  if(!st.assets||!files.length)return;
  var msg=document.getElementById('ph_msg'),btn=document.getElementById('ph_add');
  if(btn)btn.disabled=true;
  var ok=0,items=st.photos.slice(),skipped=0;
  try{
    for(var i=0;i<files.length;i++){
      if(items.length>=MAXPH){skipped=files.length-i;break;}
      if(msg)msg.textContent='กำลังอัปโหลดรูปที่ '+(i+1)+' จาก '+files.length+'…';
      var blob=await shrinkImage(files[i],1280);
      var r=await st.assets.upload(blob,{type:'image/jpeg'});
      items.push({id:r.id});
      await st.db.doc('site/photos').set({items:items});
      st.photos=items.slice();ok++;
    }
    toast('เพิ่มรูปแล้ว '+ok+' รูป'+(skipped?' (เกินจำนวนสูงสุด ข้าม '+skipped+' รูป)':''));
  }catch(e){toast(photoErr(e),true);}
  renderGate();
  if($('#layer').innerHTML)openPhotos();
}
async function deletePhoto(id){
  var items=st.photos.filter(function(p){return p.id!==id;});
  var ok=await run(function(){return st.db.doc('site/photos').set({items:items});});
  if(!ok)return;
  st.photos=items;
  try{if(st.assets)await st.assets.delete(id);}catch(e){}
  toast('ลบรูปแล้ว');
  renderGate();openPhotos();
}

function exportBackup(){
  var out={app:'ban-kru-pae-logbook',version:1,exportedAt:new Date().toISOString(),data:{}};
  COLLS.forEach(function(c){out.data[c]={};st[c].forEach(function(v,id){out.data[c][id]=strip(v);});});
  out.data.settings={main:clone(st.settings)};
  saveDownload(new Blob([JSON.stringify(out)],{type:'application/json'}),'สำรองข้อมูล-บ้านดนตรีครูแป้-'+todayISO()+'.json');
  toast('ดาวน์โหลดไฟล์สำรองแล้ว');

async function importBackup(file){
  var msg=document.getElementById('imp_msg');
  function say(t){if(msg)msg.textContent=t;}
  try{
    var obj=JSON.parse(await file.text());
    if(!obj||obj.app!=='ban-kru-pae-logbook'||!obj.data)throw new Error('ไฟล์นี้ไม่ใช่ไฟล์สำรองของสมุดบันทึก');
    var cols=COLLS.concat(['settings']),total=0,summary=[];
    cols.forEach(function(c){var n=Object.keys(obj.data[c]||{}).length;total+=n;if(n&&c!=='settings')summary.push(n+' รายการ ('+c+')');});
    if(!total)throw new Error('ไม่พบข้อมูลในไฟล์');
    if(!window.confirm('นำเข้าข้อมูล '+total+' รายการ\n'+summary.join(', ')+'\nข้อมูลที่มี id เดียวกันจะถูกเขียนทับ ต้องการนำเข้าใช่ไหม?'))return;
    var ops=[];
    cols.forEach(function(c){var d=obj.data[c]||{};Object.keys(d).forEach(function(id){ops.push([c+'/'+id,d[id]]);});});
    for(var i=0;i<ops.length;i+=400){
      say('กำลังนำเข้า '+Math.min(i+400,ops.length)+' จาก '+ops.length+'…');
      var b=st.db.batch();
      ops.slice(i,i+400).forEach(function(o){b.set(st.db.doc(o[0]),o[1]);});
      await b.commit();
    }
    say('');toast('นำเข้าข้อมูลแล้ว '+ops.length+' รายการ');closeDlg();
  }catch(e){say('');toast((e&&e.message)?e.message:'นำเข้าไม่สำเร็จ',true);}
}

function ensureDraft(key){
  if(st.drafts[key])return st.drafts[key];
  var card=buildCards(st.attDate).find(function(c){return c.key===key;});
  st.drafts[key]={att:Object.assign({},(card&&card.saved&&card.saved.att)||{}),extra:[],hours:null};
  return st.drafts[key];
}
async function saveCard(key){
  var card=buildCards(st.attDate).find(function(c){return c.key===key;});
  if(!card)return;
  var data={classId:card.classId||null,date:st.attDate,name:card.name,teacherId:card.teacherId||null,start:card.start||'',hours:cardHours(card)||0,att:cardAtt(card)};
  if(card.saved&&card.saved.example)data.example=true;
  if(await run(function(){return st.db.doc('sessions/'+key).set(data);},'บันทึกเช็คชื่อแล้ว')){delete st.drafts[key];scheduleRender();}
}
async function clearExamples(){
  var n=0;
  try{
    for(var i=0;i<COLLS.length;i++){
      var items=Array.from(st[COLLS[i]].values()).filter(function(x){return x.example;});
      for(var j=0;j<items.length;j++){await st.db.doc(COLLS[i]+'/'+items[j].id).delete();n++;await sleep(40);}
    }
    toast('ลบข้อมูลตัวอย่าง '+n+' รายการแล้ว');
  }catch(e){toast(errText(e),true);}
}

async function exportLedger(){
  if(typeof XLSX==='undefined'){toast('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ลองรีเฟรชหน้านี้',true);return;}
  var dl=null;
  dl={save:async function(o){
    var blob=new Blob([o.data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    var url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
  }};
  if(!dl){toast('หน้านี้ยังบันทึกไฟล์ในมุมมองนี้ไม่ได้ ลองเปิดจากแอป Claude หรือ claude.ai',true);return;}
  var m=st.month,ev=ledgerRows(m),list=activeStudents(),cols=8;
  list.forEach(function(s){var r=ev.get(s.id);cols=Math.max(cols,Math.round(+course(s).hours||0),r?r.cells.length:0);});
  cols=Math.min(cols,40);
  var aoa=[['ตารางชั่วโมงเรียน บ้านดนตรีครูแป้ '+monthLabel(m)],[]];
  var head=['ที่','ชื่อ','ชั่วโมงคอร์ส'],i;
  for(i=1;i<=cols;i++)head.push(i);
  head.push('เหลือ','ขาด (วันที่)','ลา (วันที่)','จำนวนลา');
  aoa.push(head);
  list.forEach(function(s,k){
    var r=ev.get(s.id)||{cells:[],ab:[],lv:[]},tot=Math.round(+course(s).hours||0),row=[k+1,s.name,+course(s).hours||0];
    for(var j=0;j<cols;j++){var c=r.cells[j];row.push(c?(c.mk?c.d+'ช':c.d):'');}
    row.push(tot-r.cells.length,r.ab.join(', '),r.lv.join(', '),r.lv.length);
    aoa.push(row);
  });
  aoa.push([],['หมายเหตุ: ตัวเลข = วันที่เรียน, ตัวเลขตามด้วย "ช" = เรียนชดเชย, ลาได้ '+LEAVE_LIMIT+' ครั้งต่อเดือน']);
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  var widths=[{wch:5},{wch:24},{wch:12}];for(i=0;i<cols;i++)widths.push({wch:5});
  widths.push({wch:8},{wch:18},{wch:18},{wch:10});
  ws['!cols']=widths;
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:Math.min(cols+2,12)}}];
  var bd={style:'thin',color:{rgb:'444444'}},border={top:bd,bottom:bd,left:bd,right:bd};
  var ncol=head.length,lastRow=2+list.length;
  ws['A1'].s={font:{bold:true,sz:16},alignment:{horizontal:'left',vertical:'center'}};
  for(var rr=2;rr<=lastRow;rr++){
    for(var cc=0;cc<ncol;cc++){
      var ref=XLSX.utils.encode_cell({r:rr,c:cc});
      if(!ws[ref])ws[ref]={t:'s',v:''};
      var isHead=rr===2,isName=cc===1,isAb=cc===ncol-3||cc===ncol-2;
      ws[ref].s={
        border:border,
        font:isHead?{bold:true}:{},
        fill:isHead?{patternType:'solid',fgColor:{rgb:'F3EBD8'}}:undefined,
        alignment:{horizontal:(isName||isAb)&&!isHead?'left':'center',vertical:'center',wrapText:isHead}
      };
    }
  }
  ws['!rows']=[{hpt:26}];
  ws['!pageSetup']={orientation:'landscape',paperSize:9,fitToWidth:1,fitToHeight:0};
  ws['!sheetPr']={pageSetUpPr:{fitToPage:true}};
  ws['!margins']={left:0.4,right:0.4,top:0.6,bottom:0.6,header:0.3,footer:0.3};
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ตารางชั่วโมง');
  var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  try{
    await dl.save({filename:'ตารางชั่วโมง-'+m+'.xlsx',data:buf});
    toast('บันทึกไฟล์ Excel แล้ว');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('บันทึกไฟล์ไม่สำเร็จ ลองอีกครั้ง',true);
  }
}

function makeFakeDb(){
  var store={},subs=[],fresh=true;
  try{var raw=localStorage.getItem('demo-db-v1');if(raw){store=JSON.parse(raw);fresh=false;}}catch(e){}
  function cp(o){return JSON.parse(JSON.stringify(o));}
  function save(){try{localStorage.setItem('demo-db-v1',JSON.stringify(store));}catch(e){}}
  function docSnap(path){var d=store[path];return {id:path.split('/').pop(),exists:d!==undefined,data:function(){return d===undefined?undefined:cp(d);}};}
  function colDocs(name){return Object.keys(store).filter(function(p){return p.indexOf(name+'/')===0&&p.split('/').length===2;}).map(docSnap);}
  function fire(s){setTimeout(function(){if(s.kind==='doc')s.cb(docSnap(s.path));else s.cb({docs:colDocs(s.path)});},0);}
  function notify(){subs.slice().forEach(fire);}
  function sub(kind,path,cb){var s={kind:kind,path:path,cb:cb};subs.push(s);fire(s);return function(){subs=subs.filter(function(x){return x!==s;});};}
  var db={
    fresh:fresh,
    put:function(path,d){store[path]=cp(d);},
    flush:function(){save();notify();},
    doc:function(path){return {path:path,
      set:function(d){store[path]=cp(d);save();notify();return Promise.resolve();},
      delete:function(){delete store[path];save();notify();return Promise.resolve();},
      onSnapshot:function(cb){return sub('doc',path,cb);}};},
    collection:function(name){return {onSnapshot:function(cb){return sub('col',name,cb);}};},
    batch:function(){var ops=[];return {set:function(r,d){ops.push([r.path,d]);return this;},commit:function(){ops.forEach(function(o){store[o[0]]=cp(o[1]);});save();notify();return Promise.resolve();}};}
  };
  return db;
}

  var cls=[[6,'09:00','กีตาร์ เช้าวันเสาร์','t1',[0,1,2]],[6,'10:30','เปียโน เช้าวันเสาร์','t2',[3,4,5]],[6,'13:00','ร้องเพลง บ่ายวันเสาร์','t1',[6,7,8]],[0,'09:00','กีตาร์ เช้าวันอาทิตย์','t2',[9,10,11]],[0,'10:30','กลอง วันอาทิตย์','t1',[12,13]],[1,'16:00','ยูคูเลเล่ เย็นวันจันทร์','t2',[0,3]],[3,'16:30','เปียโน เย็นวันพุธ','t1',[4,5]]];
  var today=todayISO(),k=0;
  cls.forEach(function(c,i){
    var cid='demo-c'+pad(i+1);
    db.put('classes/'+cid,{hours:1,name:c[2],start:c[1],studentIds:c[4].map(function(x){return ids[x];}),teacherId:c[3],weekday:c[0]});
    for(var d=-21;d<=0;d++){
      var iso=addDaysISO(today,d);
      if(new Date(iso+'T00:00:00').getDay()!==c[0])continue;
      var att={};
      c[4].forEach(function(x){k++;att[ids[x]]=(k%11===0)?'a':(k%7===0)?'l':'p';});
      db.put('sessions/'+cid+'_'+iso,{att:att,classId:cid,date:iso,hours:1,name:c[2],start:c[1],teacherId:c[3]});
    }
  });
  var month=today.slice(0,7);
  for(var i=0;i<10;i++){
    db.put('payments/demo-p'+pad(i+1),{amount:price[courses[i]],date:addDaysISO(today,-(i%6)),method:(i%3===0)?'cash':'transfer',month:month,note:'ข้อมูลตัวอย่าง',studentId:ids[i]});
  }
  db.flush();
}
async function init(){
  document.body.classList.add('gated');renderGate();
  render();
  st.db=makeFakeDb();
  if(st.db.fresh)seedDemo(st.db);
  st.dbChecked=true;st.authChecked=true;st.user={demo:true};st.assets=null;
  startData();
  renderGate();render();
}
init();
})();
</script>
